name: cardlyi

services:

  redis:
    image: redis/redis-stack:latest
    container_name: cardlyi_redis_stack
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - cardlyi_redis:/data


  rabbitmq:
    image: rabbitmq:3-management
    container_name: cardlyi_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password

  mongodb:
    image: mongo:latest
    container_name: cardlyi_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - cardlyi_mongodb:/data/db

volumes:
  cardlyi_redis:
  cardlyi_mongodb: